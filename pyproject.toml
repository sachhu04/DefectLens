[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defectlens"
version = "0.1.0"
description = "Efficient ViT anomaly detection with MCTF token fusion"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "timm",
    "numpy",
    "opencv-python",
    "matplotlib",
    "scikit-learn",
    "faiss-cpu",
    "tqdm",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
    "fvcore",
    "thop",
    "requests",
    "pillow",
]

[tool.setuptools]
packages = ["src", "src.models", "src.visualization", "src.data", "backend", "backend.app"]
